<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - SnappVid</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --border-color: rgba(255, 255, 255, 0.15);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--surface-color);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        h1 { font-size: 24px; margin-bottom: 24px; text-align: center; }
        p { color: var(--text-secondary); margin-bottom: 32px; text-align: center; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary); }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>お問い合わせ</h1>
        <p>サービスに関するご質問や、特定商取引法に基づく情報の開示請求はこちらからご連絡ください。</p>
        <form action="mailto:moriretsu06@gmail.com" method="post" enctype="text/plain">
            <div class="form-group">
                <label>お名前</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>お問い合わせ内容</label>
                <textarea name="message" rows="5" required></textarea>
            </div>
            <button type="submit">メールを送信する</button>
        </form>
        <a href="/" class="back-link">ホームへ戻る</a>
    </div>
</body>
</html>
