<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnappVid Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --border-color: rgba(255, 255, 255, 0.15);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--surface-color);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent);
        }
        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .log-section {
            background: var(--surface-color);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active { background: rgba(10, 132, 255, 0.2); color: #0a84ff; }
        .status-idle { background: rgba(255, 255, 255, 0.1); color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Analytics Dashboard</h1>
            <button class="refresh-btn" onclick="fetchStats()">Refresh Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedJobs">-</div>
                <div class="stat-label">Videos Created</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeJobs">-</div>
                <div class="stat-label">Active Jobs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCredits">-</div>
                <div class="stat-label">Total Credits</div>
            </div>
        </div>

        <div class="log-section">
            <h2 style="margin-top:0; margin-bottom: 20px;">System Status</h2>
            <div id="systemStatus" class="status-badge status-idle">Checking...</div>
            <p id="lastUpdated" style="color: var(--text-secondary); font-size: 12px; margin-top: 16px;">Last updated: -</p>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                
                document.getElementById('totalUsers').textContent = data.total_users;
                document.getElementById('completedJobs').textContent = data.completed_jobs;
                document.getElementById('activeJobs').textContent = data.active_jobs;
                document.getElementById('totalCredits').textContent = Math.round(data.total_credits_outstanding);
                
                const statusBadge = document.getElementById('systemStatus');
                if (data.active_jobs > 0) {
                    statusBadge.textContent = 'SYSTEM BUSY (Processing Job)';
                    statusBadge.className = 'status-badge status-active';
                } else {
                    statusBadge.textContent = 'SYSTEM IDLE';
                    statusBadge.className = 'status-badge status-idle';
                }
                
                document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleString();
            } catch (error) {
                console.error('Failed to fetch stats:', error);
            }
        }

        // Initial fetch
        fetchStats();
        // Auto refresh every 30 seconds
        setInterval(fetchStats, 30000);
    </script>
</body>
</html>
